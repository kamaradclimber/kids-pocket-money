---
# Example deployment for the family Kubernetes cluster.
# The app itself only needs: a persistent volume on /data (SQLite), and
# a reverse proxy in front that sets Remote-User / Remote-Groups (authelia).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kids-pocket-money
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kids-pocket-money
  labels:
    app: kids-pocket-money
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kids-pocket-money
  template:
    metadata:
      labels:
        app: kids-pocket-money
    spec:
      serviceAccountName: kids-pocket-money
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kids-pocket-money
          image: docker.io/kamaradclimber/kids-pocket-money:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DATA_DIR
              value: "/data"
            # Members of this Remote-Groups group get the parent view.
            - name: ADMIN_GROUP
              value: "parents"
            - name: SECURE_COOKIES
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              port: http
              path: /readyz
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              port: http
              path: /healthz
            timeoutSeconds: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kids-pocket-money
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kids-pocket-money
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kids-pocket-money
spec:
  selector:
    app: kids-pocket-money
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
# Example Traefik IngressRoute: everything goes through authelia, which
# sets the Remote-User / Remote-Groups / Remote-Email headers.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kids-pocket-money
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`pocket.familleseux.net`)
      priority: 10
      middlewares:
        - name: authelia2
      services:
        - kind: Service
          name: kids-pocket-money
          port: 8080
          scheme: http
          nativeLB: true